<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6b57">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style>
<title>Bancada Técnica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: cabeçalho fixo no topo, conteúdo em coluna única de bancada, abas fixas embaixo (uso com uma mão) */
:root{
  --bg:#eceeea; --surface:#f8f9f6; --fg:#17211c; --muted:#5a685f; --line:#cdd4ce;
  --accent:#0a6b57; --accent-fg:#ffffff; --ok:#17743f; --warn:#9a5b00; --bad:#b3261e;
  --font-display:"Space Grotesk",system-ui,sans-serif;
  --font-body:"Inter",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1512; --surface:#18201b; --fg:#e3ebe5; --muted:#92a398; --line:#2b372f;
    --accent:#4cc9a2; --accent-fg:#06231b; --ok:#5fd18d; --warn:#e0a13a; --bad:#ff8a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18201b; --fg:#e3ebe5; --muted:#92a398; --line:#2b372f;
  --accent:#4cc9a2; --accent-fg:#06231b; --ok:#5fd18d; --warn:#e0a13a; --bad:#ff8a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:640px;margin:0 auto;min-width:0}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topo .col{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px}
.topo h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.topo .meta{font:500 12px var(--font-mono);color:var(--muted);white-space:nowrap}

main{padding-block:16px 120px}
.intro{color:var(--muted);font-size:13px;margin:0 0 14px;max-width:60ch}

.barra{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.chip{flex:none;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);font:16px/1.4 var(--font-body)}
textarea{min-height:88px;resize:vertical}
textarea.mono,input.mono{font-family:var(--font-mono);font-size:14px}
label.f{display:grid;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg)}
.busca{margin:4px 0 14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.perigo{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

.falha,.rep,.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.falha-head,.rep-head{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:start;text-align:left;padding:12px 14px;border:0;background:none}
.eq{grid-column:1/-1;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sint{font-weight:600;overflow-wrap:anywhere}
.prog{font:500 12px var(--font-mono);color:var(--muted);white-space:nowrap}
.prog.done{color:var(--ok)}
.corpo{padding:0 14px 14px;border-top:1px solid var(--line)}
.corpo h4{margin:14px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--font-mono);font-weight:500}
.corpo ol{margin:0;padding-left:22px}
.corpo ol li{margin-bottom:4px}
.testes{list-style:none;margin:0;padding:0}
.testes label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;min-height:44px;border-bottom:1px solid var(--line)}
.testes li:last-child label{border-bottom:0}
.testes input{width:22px;min-height:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.testes span{min-width:0;overflow-wrap:anywhere}
.testes input:checked+span{color:var(--muted);text-decoration:line-through}
.vazio{color:var(--muted);padding:24px 0;text-align:center}

.badge{display:inline-block;padding:1px 8px;border:1px solid currentColor;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.ok{color:var(--ok)} .badge.peca{color:var(--warn)} .badge.sem{color:var(--bad)}
.tagex{font:500 10px var(--font-mono);letter-spacing:.08em;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle}
.serie{font:500 15px var(--font-mono)}
.dados{display:grid;gap:4px 12px;grid-template-columns:auto minmax(0,1fr);margin:12px 0 0;font-size:14px}
.dados dt{color:var(--muted)} .dados dd{margin:0;overflow-wrap:anywhere}
pre.med{margin:0;font:13px/1.5 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.foto{display:block;max-width:100%;border-radius:6px;border:1px solid var(--line);margin-top:10px}

.form{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px}
.form h2{font-size:17px}
.dois{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.topolista{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
#csvbox{margin-top:10px}

.card{padding:14px}
.card h2{font-size:17px;margin-bottom:10px}
.res{margin-top:12px;font:500 20px var(--font-mono);overflow-wrap:anywhere}
.res small{display:block;font:400 12px var(--font-body);color:var(--muted);margin-top:2px}
.faixas{display:flex;gap:6px;margin:12px 0 0}
.faixas i{width:16px;height:34px;border-radius:3px;border:1px solid var(--line);display:block}

.abas{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.abas .col{display:grid;grid-template-columns:repeat(3,1fr)}
.abas button{min-height:56px;border:0;background:none;font-size:13px;font-weight:600;color:var(--muted);position:relative}
.abas button[aria-current="page"]{color:var(--accent)}
.abas button[aria-current="page"]::after{content:"";position:absolute;left:24%;right:24%;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.n{font:500 11px var(--font-mono);margin-left:4px}

#toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;box-shadow:0 4px 16px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.falha-head:active,.btn:active{transform:scale(.99)}}
</style>
</head>
<body>

<header class="topo pad"><div class="col"><h1>Bancada Técnica</h1><span class="meta" id="hoje"></span></div></header>
<main class="pad"><div class="col" id="main"></div></main>
<nav class="abas" id="nav" aria-label="Seções"><div class="col">
  <button data-act="tab" data-tab="diag">Diagnóstico</button>
  <button data-act="tab" data-tab="rep">Reparos<span class="n" id="cnt">0</span></button>
  <button data-act="tab" data-tab="tools">Ferramentas</button>
</div></nav>
<div id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

/* ---------- Armazenamento (localStorage com reserva em memória) ---------- */
var mem={};
var store={
  get:function(k,d){
    if(k in mem) return mem[k];
    try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}
  },
  set:function(k,v){
    try{localStorage.setItem(k,JSON.stringify(v));delete mem[k];return true}
    catch(e){mem[k]=v;return false}
  }
};

/* ---------- BASE DE FALHAS: edite aqui ou use o botão “Nova falha” ----------
   eq: 'medidor' | 'terminal' | 'geral'
   causas: da mais provável para a menos provável
   testes: na ordem em que devem ser feitos                                   */
var EQ={medidor:'Medidor de energia',terminal:'Terminal de pagamento',geral:'Geral'};
var BASE=[
 {id:'b1',eq:'medidor',sintoma:'FCT reprova em “Magnet and Relay Status”',
  causas:['Relé não comuta (bobina aberta ou driver sem acionar)','Sensor magnético sem resposta ou com solda fria','Contatos do relé colados ou oxidados','Sinal do sensor não chega ao microcontrolador (trilha, pull-up)'],
  testes:['Inspeção visual do relé, do sensor e do driver sob lupa','Comandar o relé e medir a tensão na bobina','Medir continuidade dos contatos nos dois estados','Ler o nível lógico do sensor com e sem ímã próximo','Conferir pull-up/pull-down e a trilha até o microcontrolador']},
 {id:'b2',eq:'medidor',sintoma:'Leitura de energia fora da tolerância na calibração',
  causas:['Resistor divisor de tensão ou shunt fora de valor','Solda fria em componente da entrada de medição','Referência de tensão do conversor instável','Constantes de calibração gravadas incorretamente'],
  testes:['Medir os resistores do divisor e o shunt fora do circuito, se possível','Inspecionar solda na entrada de medição','Medir a referência de tensão do conversor e comparar com o projeto','Repetir a calibração com carga conhecida e comparar as leituras','Conferir os valores de calibração gravados']},
 {id:'b3',eq:'medidor',sintoma:'Sem comunicação serial (RS232/RS485)',
  causas:['Transceptor sem alimentação ou danificado','TX/RX invertidos ou trilha interrompida','Baud rate ou paridade diferentes do esperado','Solda fria no conector'],
  testes:['Medir a alimentação do transceptor','Com osciloscópio, ver se o TX transmite ao enviar um comando','Conferir a ligação TX/RX e o GND comum','Conferir baud rate, paridade e stop bits nos dois lados','Verificar continuidade do conector até o transceptor']},
 {id:'b4',eq:'medidor',sintoma:'Não liga / display apagado',
  causas:['Fonte de alimentação com componente aberto','Regulador sem saída','Cristal ou clock do microcontrolador parado','Display ou seu cabo com mau contato'],
  testes:['Medir a tensão na entrada da fonte','Medir a saída do regulador (3,3 V ou 5 V)','Ver o clock no osciloscópio','Medir o consumo de corrente com fonte limitada','Reassentar ou trocar o display']},
 {id:'b5',eq:'terminal',sintoma:'Terminal não liga',
  causas:['Bateria descarregada ou desligada','Conector de alimentação com mau contato','Curto em algum trilho de alimentação','Gerenciador de energia sem saída'],
  testes:['Medir a tensão da bateria','Alimentar por fonte externa com limite de corrente','Medir cada trilho em relação ao GND','Procurar aquecimento anormal em componentes','Conferir o botão liga/desliga e seu circuito']},
 {id:'b6',eq:'terminal',sintoma:'Leitor de tarja magnética não lê',
  causas:['Cabo flat solto ou danificado','Cabeça de leitura suja ou desgastada','Falha no circuito amplificador do sinal'],
  testes:['Limpar a cabeça com álcool isopropílico','Reassentar o cabo flat','Passar um cartão de teste e ver o sinal no osciloscópio','Conferir a alimentação do circuito de leitura']},
 {id:'b7',eq:'terminal',sintoma:'Teclas sem resposta',
  causas:['Contato da tecla oxidado ou desgastado','Trilha da matriz do teclado interrompida','Cabo ou conector do teclado solto'],
  testes:['Teste de continuidade tecla por tecla','Limpar os contatos','Medir as linhas e colunas da matriz','Reassentar o conector do teclado']},
 {id:'b8',eq:'terminal',sintoma:'Bateria não carrega',
  causas:['Conector de carga com mau contato','Circuito carregador sem alimentação','Sensor de temperatura da bateria em aberto','Bateria no fim da vida útil'],
  testes:['Medir a tensão no conector de carga','Medir a entrada e a saída do circuito carregador','Medir o sensor de temperatura da bateria','Testar com outra bateria conhecida']},
 {id:'b9',eq:'geral',sintoma:'Curto no trilho de alimentação',
  causas:['Capacitor cerâmico em curto','Circuito integrado em curto interno','Ponte de solda entre pinos'],
  testes:['Medir a resistência do trilho ao GND','Injetar corrente limitada e procurar o componente que esquenta','Retirar cerâmicos suspeitos um a um e medir de novo','Inspecionar pontes de solda sob lupa']},
 {id:'b10',eq:'geral',sintoma:'Reinicia sozinho',
  causas:['Ripple excessivo na alimentação','Capacitor de filtro com capacidade perdida','Solda fria em componente de potência','Watchdog atuando por falha do software'],
  testes:['Medir a alimentação com osciloscópio durante a falha','Substituir capacitores de filtro suspeitos','Pressionar a placa em pontos diferentes e ver se o reset muda','Verificar o log do firmware, se disponível']}
];

var EXEMPLOS=[
 {id:'e1',ex:true,data:'2026-11-09',serie:'MT-000123',eq:'medidor',falha:'FCT reprova em “Magnet and Relay Status”',med:'Bobina do relé ao comandar: 0 V\nAlimentação do driver: 3,3 V',obs:'Transistor do driver com solda fria. Retrabalho e novo FCT aprovado.',res:'ok'},
 {id:'e2',ex:true,data:'2026-11-10',serie:'TP-884210',eq:'terminal',falha:'Terminal não liga',med:'Bateria: 3,2 V\nTrilho 3V3 ao GND: 0,4 Ω',obs:'Capacitor cerâmico em curto no trilho 3V3. Aguardando reposição.',res:'peca'}
];
var RES={ok:'Reparado',peca:'Aguardando peça',sem:'Sem reparo'};

/* ---------- Estado ---------- */
var custom=store.get('bt_custom',[]);
var checks=store.get('bt_checks',{});
var reparos=store.get('bt_reparos',null);
if(!reparos){reparos=EXEMPLOS.slice();store.set('bt_reparos',reparos)}
var S={tab:'diag',eq:'todos',q:'',open:null,novaFalha:false,novoRep:false,draft:{},openRep:null,confirm:null,foto:null};
var avisouArmaz=false;

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function persist(k,v){
  var ok=store.set(k,v);
  if(!ok&&!avisouArmaz){avisouArmaz=true;toast('Armazenamento do navegador indisponível ou cheio. Os dados valem só nesta sessão.')}
}
var tt;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},3200)}
function pad(n){return n<10?'0'+n:''+n}
function hojeISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dm(iso){var p=String(iso||'').split('-');return p.length===3?p[2]+'/'+p[1]:''}
function opts(obj,sel){return Object.keys(obj).map(function(k){return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+esc(obj[k])+'</option>'}).join('')}

/* ---------- Diagnóstico ---------- */
function todas(){return BASE.concat(custom.map(function(c){var o={};for(var k in c)o[k]=c[k];o.custom=true;return o}))}
function lista(){
  var q=S.q.trim().toLowerCase();
  var f=todas().filter(function(x){
    if(S.eq!=='todos'&&x.eq!==S.eq)return false;
    if(!q)return true;
    return (x.sintoma+' '+x.causas.join(' ')+' '+x.testes.join(' ')).toLowerCase().indexOf(q)>-1;
  });
  if(!f.length)return '<p class="vazio">Nenhuma falha encontrada. Ajuste o filtro ou cadastre uma nova falha.</p>';
  return f.map(card).join('');
}
function card(x){
  var feitos=(checks[x.id]||[]).length,total=x.testes.length,aberto=S.open===x.id;
  var h='<article class="falha"><button class="falha-head" data-act="toggle" data-id="'+x.id+'" aria-expanded="'+aberto+'">'
    +'<span class="eq">'+EQ[x.eq]+(x.custom?' · sua falha':'')+'</span>'
    +'<span class="sint">'+esc(x.sintoma)+'</span>'
    +'<span class="prog'+(feitos===total?' done':'')+'">'+feitos+'/'+total+' testes</span></button>';
  if(aberto){
    h+='<div class="corpo"><h4>Causas, da mais provável para a menos</h4><ol>'
      +x.causas.map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ol>'
      +'<h4>Testes na ordem</h4><ul class="testes">'
      +x.testes.map(function(t,i){
        var on=(checks[x.id]||[]).indexOf(i)>-1;
        return '<li><label><input type="checkbox" data-act="chk" data-id="'+x.id+'" data-i="'+i+'"'+(on?' checked':'')+'><span>'+esc(t)+'</span></label></li>';
      }).join('')+'</ul>'
      +'<div class="acoes"><button class="btn pri" data-act="registrar" data-id="'+x.id+'">Registrar reparo</button>'
      +'<button class="btn" data-act="zerar" data-id="'+x.id+'">Zerar testes</button>'
      +(x.custom?'<button class="btn perigo" data-act="delfalha" data-id="'+x.id+'">'+(S.confirm==='f'+x.id?'Confirmar exclusão':'Excluir falha')+'</button>':'')
      +'</div></div>';
  }
  return h+'</article>';
}
function vDiag(){
  var chips=[['todos','Todos']].concat(Object.keys(EQ).map(function(k){return [k,EQ[k]]}));
  var h='<p class="intro">Escolha o equipamento, abra a falha e marque os testes conforme avança. A base é um ponto de partida: complete com os seus casos.</p>'
   +'<div class="barra">'+chips.map(function(c){return '<button class="chip" data-act="eq" data-eq="'+c[0]+'" aria-pressed="'+(S.eq===c[0])+'">'+c[1]+'</button>'}).join('')+'</div>'
   +'<div class="busca"><input id="busca" type="search" placeholder="Buscar sintoma, causa ou teste" value="'+esc(S.q)+'" aria-label="Buscar"></div>'
   +'<div id="lista">'+lista()+'</div>'
   +'<div class="acoes"><button class="btn" data-act="novafalha">'+(S.novaFalha?'Cancelar':'Nova falha')+'</button></div>';
  if(S.novaFalha){
    h+='<div class="form" style="margin-top:14px"><h2>Nova falha</h2>'
     +'<label class="f">Equipamento<select id="nf-eq">'+opts(EQ,'medidor')+'</select></label>'
     +'<label class="f">Sintoma<input id="nf-sint" type="text" placeholder="Ex.: FCT reprova na comunicação RS232"></label>'
     +'<label class="f">Causas (uma por linha, da mais provável)<textarea id="nf-causas"></textarea></label>'
     +'<label class="f">Testes (um por linha, na ordem)<textarea id="nf-testes"></textarea></label>'
     +'<button class="btn pri" data-act="salvarfalha">Salvar falha</button></div>';
  }
  return h;
}

/* ---------- Reparos ---------- */
function repHTML(r){
  var aberto=S.openRep===r.id;
  var h='<article class="rep"><button class="rep-head" data-act="togrep" data-id="'+r.id+'" aria-expanded="'+aberto+'">'
   +'<span class="eq">'+dm(r.data)+' · '+EQ[r.eq]+'</span>'
   +'<span class="sint"><span class="serie">'+esc(r.serie||'sem série')+'</span>'+(r.ex?'<span class="tagex">EXEMPLO</span>':'')+'</span>'
   +'<span class="badge '+r.res+'">'+RES[r.res]+'</span></button>';
  if(aberto){
    h+='<div class="corpo"><dl class="dados"><dt>Falha</dt><dd>'+esc(r.falha)+'</dd>'
      +(r.med?'<dt>Medições</dt><dd><pre class="med">'+esc(r.med)+'</pre></dd>':'')
      +(r.obs?'<dt>Obs.</dt><dd>'+esc(r.obs)+'</dd>':'')+'</dl>'
      +(r.foto?'<img class="foto" alt="Foto da placa" src="'+r.foto+'">':'')
      +'<div class="acoes"><button class="btn perigo sm" data-act="delrep" data-id="'+r.id+'">'+(S.confirm==='r'+r.id?'Confirmar exclusão':'Excluir')+'</button></div></div>';
  }
  return h+'</article>';
}
function vRep(){
  var d=S.draft||{};
  var h='<div class="topolista"><button class="btn pri" data-act="novorep">'+(S.novoRep?'Fechar formulário':'Novo reparo')+'</button>'
   +'<button class="btn" data-act="copiar">Copiar CSV</button><button class="btn" data-act="baixar">Baixar CSV</button></div>'
   +'<div id="csvbox" hidden><label class="f">CSV (selecione e copie)<textarea id="csvtxt" class="mono" readonly></textarea></label></div>';
  if(S.novoRep){
    h+='<div class="form"><h2>Novo reparo</h2>'
     +'<div class="dois"><label class="f">Nº de série<input id="r-serie" class="mono" type="text" autocomplete="off" autocapitalize="characters"></label>'
     +'<label class="f">Data<input id="r-data" type="date" value="'+hojeISO()+'"></label></div>'
     +'<label class="f">Equipamento<select id="r-eq">'+opts(EQ,d.eq||'medidor')+'</select></label>'
     +'<label class="f">Falha<input id="r-falha" type="text" value="'+esc(d.falha||'')+'" placeholder="Sintoma observado"></label>'
     +'<label class="f">Medições (ponto: valor)<textarea id="r-med" class="mono" placeholder="TP5: 3,31 V&#10;Bobina do relé: 0 V"></textarea></label>'
     +'<label class="f">Observações<textarea id="r-obs" placeholder="Causa encontrada e o que foi feito"></textarea></label>'
     +'<label class="f">Resultado<select id="r-res">'+opts(RES,'ok')+'</select></label>'
     +'<label class="f">Foto da placa<input id="r-foto" type="file" accept="image/*"></label>'
     +'<div id="fotoprev"></div>'
     +'<button class="btn pri" data-act="salvarrep">Salvar reparo</button></div>';
  }
  var ord=reparos.slice().sort(function(a,b){return (b.data||'').localeCompare(a.data||'')||(b.id>a.id?1:-1)});
  h+=ord.length?ord.map(repHTML).join(''):'<p class="vazio">Nenhum reparo registrado. Toque em “Novo reparo”.</p>';
  return h;
}
function csvCell(s){return '"'+String(s==null?'':s).replace(/"/g,'""').replace(/\r?\n/g,' | ')+'"'}
function csv(){
  var cab=['data','serie','equipamento','falha','medicoes','observacoes','resultado'];
  var linhas=[cab.join(';')].concat(reparos.map(function(r){
    return [r.data,r.serie,EQ[r.eq],r.falha,r.med,r.obs,RES[r.res]].map(csvCell).join(';');
  }));
  return linhas.join('\r\n');
}
function reduzFoto(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var m=720,s=Math.min(1,m/Math.max(img.width,img.height));
      var c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.7));
    };
    img.onerror=function(){cb(null)};
    img.src=fr.result;
  };
  fr.onerror=function(){cb(null)};
  fr.readAsDataURL(file);
}

/* ---------- Ferramentas ---------- */
var CORES=[['Preto','#111111'],['Marrom','#7b4a24'],['Vermelho','#d32f2f'],['Laranja','#f57c00'],['Amarelo','#fbc02d'],['Verde','#2e7d32'],['Azul','#1565c0'],['Violeta','#7b1fa2'],['Cinza','#8d8d8d'],['Branco','#f5f5f5']];
var MULT=[['Preto ×1',1,'#111111'],['Marrom ×10',10,'#7b4a24'],['Vermelho ×100',100,'#d32f2f'],['Laranja ×1k',1e3,'#f57c00'],['Amarelo ×10k',1e4,'#fbc02d'],['Verde ×100k',1e5,'#2e7d32'],['Azul ×1M',1e6,'#1565c0'],['Violeta ×10M',1e7,'#7b1fa2'],['Ouro ×0,1',0.1,'#c9a227'],['Prata ×0,01',0.01,'#b0b6bb']];
var TOL=[['Marrom ±1%',1,'#7b4a24'],['Vermelho ±2%',2,'#d32f2f'],['Ouro ±5%',5,'#c9a227'],['Prata ±10%',10,'#b0b6bb']];
function selOpts(arr,sel){return arr.map(function(c,i){return '<option value="'+i+'"'+(i===sel?' selected':'')+'>'+c[0]+'</option>'}).join('')}
function vTools(){
  return '<p class="intro">Cálculos rápidos de bancada. Nos campos de resistência use 4k7, 2M2, 330 ou 0,47.</p>'
   +'<section class="card"><h2>Código de cores (4 faixas)</h2><div class="dois">'
   +'<label class="f">1ª faixa<select id="c1" data-calc>'+selOpts(CORES,4)+'</select></label>'
   +'<label class="f">2ª faixa<select id="c2" data-calc>'+selOpts(CORES,7)+'</select></label>'
   +'<label class="f">Multiplicador<select id="cm" data-calc>'+selOpts(MULT,2)+'</select></label>'
   +'<label class="f">Tolerância<select id="ct" data-calc>'+selOpts(TOL,2)+'</select></label></div>'
   +'<div class="faixas" id="cf"></div><div class="res" id="cr"></div></section>'
   +'<section class="card"><h2>Divisor de tensão</h2><div class="dois">'
   +'<label class="f">Vin (V)<input id="dv" data-calc type="text" inputmode="decimal" value="5"></label>'
   +'<label class="f">R1 (superior)<input id="d1" data-calc type="text" value="10k"></label>'
   +'<label class="f">R2 (inferior)<input id="d2" data-calc type="text" value="4k7"></label></div>'
   +'<div class="res" id="dr"></div></section>'
   +'<section class="card"><h2>Corrente por shunt</h2><div class="dois">'
   +'<label class="f">Shunt (mΩ)<input id="sr" data-calc type="text" inputmode="decimal" value="500"></label>'
   +'<label class="f">Queda medida (mV)<input id="sv" data-calc type="text" inputmode="decimal" value="120"></label></div>'
   +'<div class="res" id="sres"></div></section>';
}
function num(s){var v=parseFloat(String(s).replace(',','.'));return isNaN(v)?null:v}
function parseR(s){
  s=String(s||'').trim();
  var m=s.match(/^(\d+(?:[.,]\d+)?)\s*([kKMrR])?\s*(\d+)?\s*(?:Ω|ohms?)?$/);
  if(!m)return null;
  var base=m[1].replace(',','.'),u=m[2]||'',tail=m[3];
  var f=u==='k'||u==='K'?1e3:u==='M'?1e6:1;
  var v=parseFloat(tail?base+'.'+tail:base);
  return isNaN(v)?null:v*f;
}
function n3(x){return Number(x.toPrecision(4)).toLocaleString('pt-BR')}
function fmtOhm(v){return v>=1e6?n3(v/1e6)+' MΩ':v>=1e3?n3(v/1e3)+' kΩ':n3(v)+' Ω'}
function fmtU(v,u){
  var a=Math.abs(v);
  if(a>=1||a===0)return n3(v)+' '+u;
  if(a>=1e-3)return n3(v*1e3)+' m'+u;
  return n3(v*1e6)+' µ'+u;
}
function calcAll(){
  var g=function(id){var e=document.getElementById(id);return e?e.value:''};
  if(!document.getElementById('cr'))return;
  var a=+g('c1'),b=+g('c2'),m=MULT[+g('cm')],t=TOL[+g('ct')];
  var val=(a*10+b)*m[1];
  $('#cr').innerHTML=fmtOhm(val)+' ±'+t[1]+'%<small>Faixa de '+fmtOhm(val*(1-t[1]/100))+' a '+fmtOhm(val*(1+t[1]/100))+'</small>';
  $('#cf').innerHTML=[CORES[a][1],CORES[b][1],m[2],t[2]].map(function(c){return '<i style="background:'+c+'"></i>'}).join('');
  var vin=num(g('dv')),r1=parseR(g('d1')),r2=parseR(g('d2'));
  $('#dr').innerHTML=(vin==null||r1==null||r2==null||r1+r2===0)?'<small>Preencha os três campos.</small>'
    :fmtU(vin*r2/(r1+r2),'V')+'<small>Corrente no divisor: '+fmtU(vin/(r1+r2),'A')+'</small>';
  var sr=num(g('sr')),sv=num(g('sv'));
  $('#sres').innerHTML=(sr==null||sv==null||sr===0)?'<small>Preencha os dois campos.</small>'
    :fmtU(sv/sr,'A')+'<small>I = V ÷ R (mV ÷ mΩ resulta em A)</small>';
}

/* ---------- Renderização ---------- */
function render(){
  var bs=document.querySelectorAll('#nav button');
  for(var i=0;i<bs.length;i++)bs[i].setAttribute('aria-current',bs[i].getAttribute('data-tab')===S.tab?'page':'false');
  $('#cnt').textContent=reparos.length;
  $('#main').innerHTML=S.tab==='diag'?vDiag():S.tab==='rep'?vRep():vTools();
  if(S.tab==='tools')calcAll();
}
function refreshLista(){var l=document.getElementById('lista');if(l)l.innerHTML=lista()}
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
function linhas(id){return val(id).split(/\r?\n/).map(function(s){return s.trim()}).filter(Boolean)}

document.addEventListener('click',function(ev){
  var el=ev.target.closest?ev.target.closest('[data-act]'):null;
  if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(act==='tab'){S.tab=el.getAttribute('data-tab');S.confirm=null;render();window.scrollTo(0,0)}
  else if(act==='eq'){S.eq=el.getAttribute('data-eq');render()}
  else if(act==='toggle'){S.open=S.open===id?null:id;S.confirm=null;refreshLista()}
  else if(act==='zerar'){checks[id]=[];persist('bt_checks',checks);refreshLista()}
  else if(act==='registrar'){
    var f=todas().filter(function(x){return x.id===id})[0];
    S.draft={eq:f.eq,falha:f.sintoma};S.tab='rep';S.novoRep=true;render();window.scrollTo(0,0);
  }
  else if(act==='novafalha'){S.novaFalha=!S.novaFalha;render()}
  else if(act==='salvarfalha'){
    var sint=val('nf-sint'),causas=linhas('nf-causas'),testes=linhas('nf-testes');
    if(!sint||!causas.length||!testes.length){toast('Informe o sintoma, ao menos uma causa e um teste.');return}
    custom.push({id:'c'+Date.now(),eq:val('nf-eq'),sintoma:sint,causas:causas,testes:testes});
    persist('bt_custom',custom);S.novaFalha=false;toast('Falha salva.');render();
  }
  else if(act==='delfalha'){
    if(S.confirm!=='f'+id){S.confirm='f'+id;refreshLista();return}
    custom=custom.filter(function(x){return x.id!==id});persist('bt_custom',custom);
    delete checks[id];persist('bt_checks',checks);S.open=null;S.confirm=null;refreshLista();toast('Falha excluída.');
  }
  else if(act==='novorep'){S.novoRep=!S.novoRep;if(!S.novoRep)S.draft={};S.foto=null;render()}
  else if(act==='togrep'){S.openRep=S.openRep===id?null:id;S.confirm=null;render()}
  else if(act==='salvarrep'){
    var falha=val('r-falha');
    if(!falha){toast('Informe a falha observada.');return}
    reparos.push({id:'r'+Date.now(),data:val('r-data')||hojeISO(),serie:val('r-serie'),eq:val('r-eq'),falha:falha,med:val('r-med'),obs:val('r-obs'),res:val('r-res'),foto:S.foto||null});
    persist('bt_reparos',reparos);S.novoRep=false;S.draft={};S.foto=null;toast('Reparo salvo.');render();
  }
  else if(act==='delrep'){
    if(S.confirm!=='r'+id){S.confirm='r'+id;render();return}
    reparos=reparos.filter(function(x){return x.id!==id});persist('bt_reparos',reparos);
    S.confirm=null;S.openRep=null;toast('Reparo excluído.');render();
  }
  else if(act==='copiar'){
    var txt=csv(),mostrar=function(){var b=$('#csvbox'),t=$('#csvtxt');b.hidden=false;t.value=txt;t.focus();t.select()};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast('CSV copiado.')},mostrar);
    }else mostrar();
  }
  else if(act==='baixar'){
    try{
      var blob=new Blob(['﻿'+csv()],{type:'text/csv;charset=utf-8'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='reparos-bancada.csv';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
      toast('Se o download não iniciar, use Copiar CSV.');
    }catch(e){toast('Não foi possível baixar. Use Copiar CSV.')}
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.getAttribute('data-act')==='chk'){
    var id=t.getAttribute('data-id'),i=+t.getAttribute('data-i'),arr=checks[id]||[];
    arr=arr.filter(function(x){return x!==i});
    if(t.checked)arr.push(i);
    checks[id]=arr;persist('bt_checks',checks);refreshLista();
  }else if(t.id==='r-foto'&&t.files&&t.files[0]){
    reduzFoto(t.files[0],function(d){
      S.foto=d;
      $('#fotoprev').innerHTML=d?'<img class="foto" alt="Pré-visualização da foto" src="'+d+'">':'<p class="intro">Não foi possível ler a imagem.</p>';
    });
  }else if(t.hasAttribute('data-calc'))calcAll();
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='busca'){S.q=t.value;refreshLista()}
  else if(t.hasAttribute&&t.hasAttribute('data-calc'))calcAll();
});

var dias=['dom','seg','ter','qua','qui','sex','sáb'],hj=new Date();
$('#hoje').textContent=dias[hj.getDay()]+' · '+pad(hj.getDate())+'/'+pad(hj.getMonth()+1);
render();
})();
</script>
